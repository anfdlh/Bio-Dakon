<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anfdlh Bio</title>
    <meta name="description" content="Welcome to my personal bio page. Check out my socials and what I'm up to!">
    <meta property="og:title" content="Aan's Profile">
    <meta property="og:image" content="https://files.catbox.moe/placeholder-image-dark.jpg">
    <meta name="theme-color" content="#5865F2">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
    
    <div id="particles-js"></div>

    <main class="container">
        <div class="profile-card">
            
            <!-- Avatar Section -->
            <div class="avatar-wrapper">
                <img src="https://anfdlh.vercel.app/assets/img/profile.png" alt="Profile Picture" id="profile-pic">
                <div class="status-badge" title="Online">
                    <div class="status-dot"></div>
                </div>
            </div>

            <!-- Text Content -->
            <div class="content t-center">
                <span id="greeting" class="greeting-text">Welcome</span>
                <h1 class="username">Dakon <i class="fas fa-check-circle" style="color:#5865F2; font-size: 0.6em; vertical-align: middle;"></i></h1>
                <p class="tagline">I like <span class="typing-text"></span></p>
                <p class="bio-description">
                    Student
                </p>
            </div>

            <!-- Spotify/Music Widget -->
            <div class="music-widget">
                <div class="music-status">
                    <a href="https://open.spotify.com/playlist/5bfMG67zHHB52NyxcbTBxQ?si=19d4917233f24efe" target="_blank" class="music-link-wrapper" id="default-music-view">
                        <div class="album-art">
                            <i class="fab fa-spotify"></i>
                        </div>
                        <div class="music-info">
                            <h4>Kanigara</h4>
                            <p>Listening on Spotify</p>
                        </div>
                    </a>
                    <!-- Audio Player Interface -->
                    <div id="player-view" style="display: none; width: 100%;">
                        <div class="custom-audio-player">
                            <div class="now-playing-info">
                                <h4 id="np-title">Song Title</h4>
                                <p id="np-artist">Artist Name</p>
                            </div>
                            
                            <div class="progress-container">
                                <div class="progress-bar" id="progress-bar"></div>
                            </div>

                            <div class="player-controls-row">
                                <button class="control-btn small" onclick="toggleShuffle()" id="shuffle-btn">
                                    <i class="fas fa-random"></i>
                                </button>
                                <button class="control-btn" onclick="playPrev()">
                                    <i class="fas fa-step-backward"></i>
                                </button>
                                <button class="control-btn play-pause big" onclick="togglePlayPause()" id="play-pause-btn">
                                    <i class="fas fa-pause"></i>
                                </button>
                                <button class="control-btn" onclick="playNext()">
                                    <i class="fas fa-step-forward"></i>
                                </button>
                                <button class="control-btn small" onclick="closePlayer()">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        </div>
                        <!-- HTML5 Audio Element -->
                        <audio id="audio-player" style="display: none;"></audio>
                    </div>
                    
                    <div class="equalizer">
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                    </div>
                    
                    <div class="toggle-btn" onclick="togglePlaylist()">
                        <i class="fas fa-chevron-down"></i>
                    </div>
                </div>

                <div class="playlist-container" id="playlist"></div>
            </div>

            <!-- Social Links -->
            <div class="links-grid">
                <a href="#" class="social-link discord" onclick="copyDiscord(event)">
                    <div class="social-icon"><i class="fab fa-discord"></i></div>
                    <span class="link-text">Join my Discord</span>
                    <i class="fas fa-arrow-right link-arrow"></i>
                </a>

                <a href="https://instagram.com/aanfdlhh" target="_blank" class="social-link instagram">
                    <div class="social-icon"><i class="fab fa-instagram"></i></div>
                    <span class="link-text">Follow on Instagram</span>
                    <i class="fas fa-external-link-alt link-arrow"></i>
                </a>

                <a href="https://tiktok.com/@anfdlhh" target="_blank" class="social-link tiktok">
                    <div class="social-icon"><i class="fab fa-tiktok"></i></div>
                    <span class="link-text">Watch on TikTok</span>
                    <i class="fas fa-external-link-alt link-arrow"></i>
                </a>

                <a href="https://roblox.com/users/7390335617/profile" target="_blank" class="social-link roblox">
                    <div class="social-icon"><i class="fas fa-cube"></i></div>
                    <span class="link-text">Play on Roblox</span>
                    <i class="fas fa-gamepad link-arrow"></i>
                </a>

                <a href="https://www.xbox.com/id-ID/play/user/xpaann" target="_blank" class="social-link xbox">
                    <div class="social-icon"><i class="fab fa-xbox"></i></div>
                    <span class="link-text">Add on Xbox</span>
                    <i class="fas fa-user-plus link-arrow"></i>
                </a>

                <a href="https://steamcommunity.com/id/aanfdlh" target="_blank" class="social-link steam">
                    <div class="social-icon"><i class="fab fa-steam"></i></div>
                    <span class="link-text">Let's play on Steam</span>
                    <i class="fas fa-external-link-alt link-arrow"></i>
                </a>
            </div>

            <footer class="footer">
                <p>Di gae karo  <i class="fas fa-heart heart"></i>  oleh Dakon</p>
            </footer>
        </div>
    </main>

    <!-- Notification Toast -->
    <div id="toast" class="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toast-msg">Copied!</span>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
